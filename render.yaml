envVarGroups:
  - name: shared-secrets
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15d
      # Lets the backends reject traffic that did not come through the gateway.
      # Needed because private services (type: pserv) are not on the free plan,
      # so chat-service, socket-go and expense-service each have a public URL.
      - key: INTERNAL_SECRET
        generateValue: true

services:
  # ── Gateway — the only service with a public URL ───────────────────────────
  - type: web
    name: gateway
    env: docker
    plan: free
    region: singapore
    dockerfilePath: services/gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: shared-secrets
      - key: CLIENT_URL
        sync: false
      # Backend addresses. NOTE: these are type: web, so they DO have public
      # URLs (pserv is not on the free plan) — INTERNAL_SECRET is what keeps
      # them gateway-only. hostport yields host:port with no scheme; the
      # gateway prepends http:// (see services/gateway/internal/config).
      - key: CHAT_SERVICE_URL
        fromService:
          type: web
          name: chat-service
          property: hostport
      - key: EXPENSE_SERVICE_URL
        fromService:
          type: web
          name: expense-service
          property: hostport
      - key: SOCKET_SERVICE_URL
        fromService:
          type: web
          name: socket-go
          property: hostport

  # ── Chat service — auth, users, friends, chat history (gateway-only via secret)
  - type: web
    name: chat-service
    env: docker
    plan: free
    region: singapore
    dockerfilePath: services/chat-service/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/api/health
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: shared-secrets
      # Set these manually in the Render dashboard
      - key: MONGODB_URI
        sync: false
      # services/chat-service/src/config/redis.ts reads host, port AND password separately — Redis
      # Cloud uses a non-default port and requires auth, so all three are
      # required. Without them the client silently falls back to :6379 with no
      # password and /v1/api/health reports redis:false.
      - key: REDIS_URL
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false
      # All five are read by services/chat-service/src/config/firebase.ts.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      # Sign-up codes, read by services/chat-service/src/services/otp_service.ts.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_NAME
        value: Messaging App

  # ── Expense service (public URL, gateway-only via INTERNAL_SECRET) ────────
  - type: web
    name: expense-service
    env: docker
    plan: free
    region: singapore
    dockerfilePath: services/expense-service/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/api/health
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: shared-secrets
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Slip scan (POST /v1/api/expenses/scan). Key from aistudio.google.com.
      - key: GEMINI_API_KEY
        sync: false
      # Optional; defaults to gemini-3.5-flash-lite (see src/services/scan_service.ts).
      - key: GEMINI_MODEL
        sync: false

  # ── Socket service (Go) — Socket.IO (public URL, gateway-only via secret) ──
  # Reads the same Mongo/Redis/Firebase variables as chat-service.
  - type: web
    name: socket-go
    env: docker
    plan: free
    region: singapore
    dockerfilePath: services/socket-go/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: shared-secrets
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
