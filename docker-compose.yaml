services:
  # ── PostgreSQL (local — only expense-service uses it) ──────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expenses
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  # ── Expense service (internal only — no public port) ───────────────────────
  expense-service:
    build:
      context: .
      dockerfile: services/expense-service/Dockerfile
    env_file: services/expense-service/.env
    environment:
      NODE_ENV: production
      # Overrides DATABASE_URL in .env — points to local postgres container
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/expenses?schema=public
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-dev-internal-secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # ── Chat service — auth, users, friends, chat history (internal only) ─────
  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    env_file: services/chat-service/.env
    environment:
      NODE_ENV: production
      PORT: 1500
      # Shared with the gateway so this service can reject anything that did
      # not come through it. Override in a real deployment.
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-dev-internal-secret}
    networks:
      - backend
    restart: unless-stopped

  # ── Socket service (Go) — Socket.IO for real-time messaging (internal only) ─
  socket-go:
    build:
      context: .
      dockerfile: services/socket-go/Dockerfile
    # Same Mongo/Redis/JWT/Firebase settings as chat-service
    env_file: services/chat-service/.env
    environment:
      NODE_ENV: production
      PORT: 1600
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-dev-internal-secret}
    networks:
      - backend
    restart: unless-stopped

  # ── Gateway — the only publicly exposed service ────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: services/gateway/.env
    environment:
      NODE_ENV: production
      # Docker service names resolve to internal IPs — no public URLs needed
      CHAT_SERVICE_URL: http://chat-service:1500
      SOCKET_SERVICE_URL: http://socket-go:1600
      EXPENSE_SERVICE_URL: http://expense-service:4004
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-dev-internal-secret}
    ports:
      - "80:4000"   # server port 80 → gateway port 4000
    depends_on:
      - chat-service
      - socket-go
      - expense-service
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
